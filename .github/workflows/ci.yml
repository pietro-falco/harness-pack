name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: shellcheck
        run: |
          # The version and the severity threshold come from the committed pin,
          # never from whatever the runner image happens to ship: `apt-get
          # install shellcheck` floats with the image, and the same source can
          # pass one version and fail another. tests/run_tests.sh reads the
          # same three fields and runs the same invocation.
          VER="$(sed -n 's/^SHELLCHECK_VERSION=//p' .shellcheck-version)"
          SEV="$(sed -n 's/^SHELLCHECK_SEVERITY=//p' .shellcheck-version)"
          SHA="$(sed -n 's/^SHELLCHECK_SHA256_LINUX_X86_64=//p' .shellcheck-version)"
          # Unpacked outside the checkout on purpose: the next step runs the
          # suite, and fixtures that read the working tree must not see a
          # downloaded tarball as a repo change.
          DL="${RUNNER_TEMP:-/tmp}/shellcheck-pin"
          mkdir -p "$DL"
          TAR="$DL/shellcheck-v$VER.linux.x86_64.tar.xz"
          curl -fsSL -o "$TAR" \
            "https://github.com/koalaman/shellcheck/releases/download/v$VER/shellcheck-v$VER.linux.x86_64.tar.xz"
          echo "$SHA  $TAR" | sha256sum -c -
          tar -xJf "$TAR" -C "$DL"
          SHELLCHECK="$DL/shellcheck-v$VER/shellcheck"
          "$SHELLCHECK" --version
          # Hand the pinned binary to the next step. The suite reads
          # $SHELLCHECK and runs the shell sources only when the binary is the
          # pinned version; a runner whose image ships a different shellcheck,
          # or none, leaves that half of the gate unmeasured and the suite
          # exits 2. The handoff goes through $GITHUB_ENV, not through the
          # next step's `run:` line, because a bypass fixture asserts that
          # line byte-for-byte: editing it there would break the fixture
          # rather than wire the gate.
          echo "SHELLCHECK=$SHELLCHECK" >> "$GITHUB_ENV"
          "$SHELLCHECK" --severity="$SEV" scripts/*.sh tests/*.sh
      - name: gitleaks
        run: |
          # WHY THIS STEP EXISTS. tests/bypass_fe's control 2 hands a canary to
          # a SCANNER and requires a finding: the fixture will not assert on its
          # own authority that a string is a secret. ubuntu-latest ships no
          # gitleaks, so without this step that control cannot run, the fixture
          # exits 2, ADR-017 D4 routes exit 2 to `fail`, and the step below
          # accuses this repository of a broken fixture on every push and every
          # pull request. That prediction was falsified on the authoring host
          # before CI met it; the capture is committed under the evidence tree.
          # The answer is to bring the instrument, never to soften D4 or edit
          # the fixture.
          VER="$(sed -n 's/^GITLEAKS_VERSION=//p' .gitleaks-version)"
          SHA="$(sed -n 's/^GITLEAKS_SHA256_LINUX_X64=//p' .gitleaks-version)"
          # Unpacked outside the checkout for the same reason the shellcheck
          # step above is: the next step runs the suite, and fixtures that read
          # the working tree must not see a downloaded tarball as a repo change.
          DL="${RUNNER_TEMP:-/tmp}/gitleaks-pin"
          mkdir -p "$DL"
          TAR="$DL/gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSL -o "$TAR" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VER/gitleaks_${VER}_linux_x64.tar.gz"
          echo "$SHA  $TAR" | sha256sum -c -
          # The binary sits at the ROOT of this archive, with no versioned
          # subdirectory -- gitleaks does not package the way shellcheck does --
          # so the extraction directory is itself the bin directory.
          tar -xzf "$TAR" -C "$DL"
          "$DL/gitleaks" version
          # $GITHUB_PATH, and NOT $GITHUB_ENV as the shellcheck step uses. The
          # fixture invokes the bare word `gitleaks` and gates on
          # `command -v gitleaks`: there is no $GITLEAKS seam to point at a
          # path, so a step that exported a variable would leave control 2
          # exactly where it was and this whole step would buy nothing.
          echo "$DL" >> "$GITHUB_PATH"
          # A PROBE, NOT A DEPENDENCY, and it must never fail the job. The
          # fixture needs node and this workflow pins none; if the runner image
          # stops shipping one, this line is where the log says so. Adding
          # setup-node here would erase the measurement instead of taking it,
          # which is a decision to make from the log rather than ahead of it.
          node --version || echo "note: this runner image carries no node on PATH"
      - name: tests
        run: bash tests/run_tests.sh
# Release hardening (wire at first tag, see docs/PUBLISHING.md):
# artifact attestations, OpenSSF Scorecard, npm OIDC provenance.
# gitleaks left that list on 2026-08-12. It is no longer something to wire at a
# tag: it is the step above, and it is there for a reason that has nothing to do
# with release hardening -- a bypass fixture needs an external judgment on a
# canary. What that step brings is the SCANNER, not a secret gate over this
# repository's own tree. The gate is a separate decision and is still open.
