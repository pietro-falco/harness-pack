name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: shellcheck
        run: |
          # The version and the severity threshold come from the committed pin,
          # never from whatever the runner image happens to ship: `apt-get
          # install shellcheck` floats with the image, and the same source can
          # pass one version and fail another. tests/run_tests.sh reads the
          # same three fields and runs the same invocation.
          VER="$(sed -n 's/^SHELLCHECK_VERSION=//p' .shellcheck-version)"
          SEV="$(sed -n 's/^SHELLCHECK_SEVERITY=//p' .shellcheck-version)"
          SHA="$(sed -n 's/^SHELLCHECK_SHA256_LINUX_X86_64=//p' .shellcheck-version)"
          # Unpacked outside the checkout on purpose: the next step runs the
          # suite, and fixtures that read the working tree must not see a
          # downloaded tarball as a repo change.
          DL="${RUNNER_TEMP:-/tmp}/shellcheck-pin"
          mkdir -p "$DL"
          TAR="$DL/shellcheck-v$VER.linux.x86_64.tar.xz"
          curl -fsSL -o "$TAR" \
            "https://github.com/koalaman/shellcheck/releases/download/v$VER/shellcheck-v$VER.linux.x86_64.tar.xz"
          echo "$SHA  $TAR" | sha256sum -c -
          tar -xJf "$TAR" -C "$DL"
          SHELLCHECK="$DL/shellcheck-v$VER/shellcheck"
          "$SHELLCHECK" --version
          # Hand the pinned binary to the next step. The suite reads
          # $SHELLCHECK and runs the shell sources only when the binary is the
          # pinned version; a runner whose image ships a different shellcheck,
          # or none, leaves that half of the gate unmeasured and the suite
          # exits 2. The handoff goes through $GITHUB_ENV, not through the
          # next step's `run:` line, because a bypass fixture asserts that
          # line byte-for-byte: editing it there would break the fixture
          # rather than wire the gate.
          echo "SHELLCHECK=$SHELLCHECK" >> "$GITHUB_ENV"
          "$SHELLCHECK" --severity="$SEV" scripts/*.sh tests/*.sh
      - name: tests
        run: bash tests/run_tests.sh
# Release hardening (wire at first tag, see docs/PUBLISHING.md):
# artifact attestations, OpenSSF Scorecard, gitleaks, npm OIDC provenance.
