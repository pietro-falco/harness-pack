# The surfaces scripts/gate_adr_contract.sh reads. Declaration, not derivation:
# the gate is its reader and tests/gate_adr_contract_fixture.sh asserts the
# parity between what is declared here and what tests/run_tests.sh actually
# hands to shellcheck and py_compile.
#
# Format: "KEY value", one per line, spaces only, no tabs. '#' comments a line.
#   VERSION     declaration format. The gate refuses anything but 1.
#   ADR_PREFIX  repo-root-relative path prefix, must end with '/'.
#   GLOB        <dir>/<pattern>, dir literal, pattern free of '/' -- character
#               for character a glob the suite's lint lines pass to a linter.
#   LINT_LINES  how many non-comment lines in tests/run_tests.sh hand a glob to
#               shellcheck or py_compile. A number that certifies a gate lives in
#               the tree: if the suite grows a third lint line, this fixture goes
#               red and somebody looks, which is the whole point.
#
# NOT declared here, on purpose: the two ADR snapshots under runs/ are records of
# accepted ADRs, not ADRs. And the linters expand these globs over the WORKING
# TREE, so an untracked file can be linted while never being on this surface --
# the gate reports tracked files only, and the fixture measures that gap.
VERSION 1
ADR_PREFIX docs/adrs/
GLOB scripts/*.sh
GLOB scripts/*.py
GLOB tests/*.sh
LINT_LINES 2
